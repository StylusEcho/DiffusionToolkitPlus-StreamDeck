<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="pi.css" />
		<script src="pi.js"></script>
	</head>
	<body>
		<div class="row">
			<label for="rating">Rating</label>
			<select id="rating" data-setting="rating">
				<option value="1">1 star</option>
				<option value="2">2 stars</option>
				<option value="3" selected>3 stars</option>
				<option value="4">4 stars</option>
				<option value="5">5 stars</option>
				<option value="6">6 stars</option>
				<option value="7">7 stars</option>
				<option value="8">8 stars</option>
				<option value="9">9 stars</option>
				<option value="10">10 stars</option>
				<option value="0">Clear rating</option>
			</select>
		</div>

		<div class="row">
			<label for="port">Port</label>
			<input id="port" type="number" min="1" max="65535" value="9760" data-setting="port" data-global />
		</div>

		<details>
			<summary>Setup</summary>
			<p>
				In Diffusion Toolkit Plus, open <b>Settings &rarr; General</b> and tick
				<b>Allow control from another application on this computer</b>. The port here must match
				the one there.
			</p>
		</details>
	</body>
</html>
