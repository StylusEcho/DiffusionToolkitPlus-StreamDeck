<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="pi.css" />
		<script src="pi.js"></script>
	</head>
	<body>
		<div class="row">
			<label for="show">Show</label>
			<select id="show" data-setting="show">
				<option value="both" selected>Page and results</option>
				<option value="page">Page only</option>
				<option value="results">Results only</option>
			</select>
		</div>

		<div class="row">
			<label for="port">Port</label>
			<input id="port" type="number" min="1" max="65535" value="9760" data-setting="port" data-global />
		</div>

		<details>
			<summary>Setup</summary>
			<p>
				In Diffusion Toolkit Plus, open <b>Settings &rarr; General</b> and tick
				<b>Allow control from another application on this computer</b>. The port here must match
				the one there.
			</p>
			<p>Pressing this key refreshes the current search.</p>
		</details>
	</body>
</html>
